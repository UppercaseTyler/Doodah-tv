services:
  
  doodah-tv:
    build: .
    container_name: doodah-tv
    ports:
      - "8090:8090"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./output:/app/output
    restart: unless-stopped


  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr
    ports:
      - "9191:9191"
    volumes:
      - ./dispatcharr:/data
    restart: unless-stopped
    depends_on:
      - doodah-tv
